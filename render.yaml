databases:
  - name: kahoot-lite-db
    plan: free
    databaseName: kahoot_lite
    user: kahoot_lite

services:
  - type: web
    name: kahoot-lite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: kahoot-lite-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
