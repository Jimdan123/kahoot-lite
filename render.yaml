databases:
  - name: kahoot-lite-db
    plan: free
    databaseName: kahoot_lite
    user: kahoot_lite

services:
  - type: web
    name: kahoot-lite
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Required in production, same as SECRET_KEY — encrypts user-saved
      # BYOK provider API keys at rest (app/crypto_utils.py).
      - key: API_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kahoot-lite-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      # Optional fallback tiers (see app/ai/langgraph_flow/llm_utils.py) —
      # each one silently no-ops without its key, but declaring them here
      # means Render's dashboard prompts for a value on the next deploy
      # instead of the tier quietly never activating.
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Optional — enrich_context node (thin/definitional or leaky-retry
      # documents), see app/ai/langgraph_flow/nodes/enrich.py.
      - key: TAVILY_API_KEY
        sync: false
      # Optional — evals/'s MLflow run logging (see evals/README.md).
      # Reuses the same Postgres instance as DATABASE_URL; MLflow's
      # SQLAlchemy backend store creates its own tables there, no
      # collision, no new Render service. No-ops entirely if unset — see
      # evals/config.py::has_mlflow().
      - key: MLFLOW_TRACKING_URI
        fromDatabase:
          name: kahoot-lite-db
          property: connectionString
