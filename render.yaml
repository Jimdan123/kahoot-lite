databases:
  - name: kahoot-lite-db
    plan: free
    databaseName: kahoot_lite
    user: kahoot_lite

services:
  - type: web
    name: kahoot-lite
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kahoot-lite-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
