{% extends 'base.html' %}
{% block content %}
<div id="lobby" class="gscreen">
    <div class="text-center">
        <p class="text-muted mb-0">Game PIN</p>
        <h1 class="display-1 pin-display">{{ room.pin }}</h1>
        <p class="text-muted">Players join at <code>{{ join_url }}</code></p>
        <img src="{{ qr_data_uri }}" alt="Join QR" style="max-width: 200px; border-radius:12px;" class="my-3">
    </div>
    <hr style="border-color:var(--line); opacity:1;">
    <h4 style="font-size:1rem;">Players (<span id="player-count">0</span>)</h4>
    <div id="player-list" style="display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.4rem;"></div>
    <button id="start-btn" class="btn btn-lg btn-success" style="width:100%;" disabled>Start Game</button>
</div>

<div id="question" class="gscreen" style="display:none">
    <div class="kicker"><span class="dot"></span><span id="q-progress"></span></div>
    <h2 id="q-text" class="q-text" style="font-size:1.5rem;"></h2>
    <div id="q-options" class="opts-grid" style="margin-bottom:1.3rem;"></div>
    <div class="timer-row">
        <span id="timer" class="timer-num"></span>
        <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
    </div>
    <button id="reveal-btn" class="btn btn-warning">Reveal Answer</button>
</div>

<div id="reveal" class="gscreen" style="display:none">
    <div class="kicker"><span class="dot"></span>Correct answer</div>
    <h3 style="margin:0 0 1.3rem; display:flex; align-items:center; gap:.6rem;">
        <span class="badge" id="correct" style="background:var(--success); color:#fff; padding:.4rem .75rem; font-size:.95rem;"></span>
        is correct
    </h3>
    <h4 style="font-size:1rem; margin:0 0 .6rem;">Leaderboard</h4>
    <ol id="leaderboard" class="board" style="margin-bottom:1.3rem;"></ol>
    <button id="next-btn" class="btn btn-primary">Next Question</button>
</div>

<div id="done" class="gscreen" style="display:none">
    <h2>Game Over</h2>
    <h4 style="font-size:1rem;">Final Leaderboard</h4>
    <ol id="final-leaderboard" class="board" style="margin-bottom:1.3rem;"></ol>
    <a href="{{ url_for('game.host_dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce() }}">
const PIN = "{{ room.pin }}";
const socket = io();
let timerInterval = null;
let currentTimeLimit = 20;

// One-time clock-offset calibration against the server's clock (see
// socket_events.py's sync_time), so this client's countdown agrees with
// every other client's on the same real-world deadline, regardless of how
// long any individual socket message happens to take to arrive. Assumes
// symmetric latency (request/response take about the same time) — a fair
// approximation for same-network play, good enough for ~200ms agreement,
// not NTP-grade precision.
let clockOffsetMs = 0;
let clockCalibrated = false;

function calibrateClock() {
    socket.emit('sync_time', {client_sent_at: Date.now()});
}

socket.on('sync_time_ack', (data) => {
    const rtt = Date.now() - data.client_sent_at;
    clockOffsetMs = data.server_time_ms - (data.client_sent_at + rtt / 2);
    clockCalibrated = true;
});

socket.on('connect', () => {
    calibrateClock();
    socket.emit('host_join', {pin: PIN});
});

// Full snapshot: only sent once, when this host socket connects/reconnects
// (see on_host_join server-side) — the resync point for whatever the room's
// actual roster is. Every join/leave after that arrives as a small delta
// (players_joined / player_left below) instead of the whole list again.
socket.on('player_list', (players) => {
    const list = document.getElementById('player-list');
    list.innerHTML = '';
    players.forEach(p => addPlayerChip(p.nickname));
    updatePlayerCount();
});

// Batched, not one event per join: the server holds joins for up to ~150ms
// and sends whoever arrived in that window as one list, so a burst of many
// simultaneous joins is O(bursts) broadcasts instead of O(joins) — see
// JOIN_BATCH_WINDOW_SECONDS in socket_events.py for why that distinction
// actually matters (broadcasting to a room is O(n) fanout regardless of
// payload size, so O(n) individual joins was still O(n^2) deliveries even
// with a tiny per-join payload).
socket.on('players_joined', (data) => {
    let added = false;
    data.nicknames.forEach(nickname => {
        // Dedupe by nickname: the same-tab-reload edge case in
        // on_player_join can queue this for a nickname the host's list
        // never actually lost, so blindly appending would create a
        // visible duplicate chip.
        if (!findPlayerChip(nickname)) {
            addPlayerChip(nickname);
            added = true;
        }
    });
    if (added) updatePlayerCount();
});

socket.on('player_left', (data) => {
    const chip = findPlayerChip(data.nickname);
    if (chip) {
        chip.remove();
        updatePlayerCount();
    }
});

function findPlayerChip(nickname) {
    return Array.from(document.getElementById('player-list').children)
        .find(el => el.textContent === nickname);
}

function addPlayerChip(nickname) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = nickname;
    document.getElementById('player-list').appendChild(chip);
}

function updatePlayerCount() {
    const count = document.getElementById('player-list').children.length;
    document.getElementById('player-count').textContent = count;
    document.getElementById('start-btn').disabled = count === 0;
}

document.getElementById('start-btn').onclick = (e) => {
    e.target.disabled = true;
    socket.emit('start_game', {pin: PIN});
};

socket.on('question_start', (q) => {
    currentTimeLimit = q.time_limit;
    showOnly('question');
    document.getElementById('q-progress').textContent = 'Question ' + (q.index + 1) + ' of ' + q.total;
    document.getElementById('q-text').textContent = q.text;
    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    const letters = ['a', 'b', 'c', 'd'];
    let i = 0;
    for (const [key, val] of Object.entries(q.options)) {
        const letterClass = 'opt-' + (letters[i++] || 'a');
        const row = document.createElement('div');
        row.className = 'opt-btn ' + letterClass;
        row.innerHTML = '<span class="opt-letter">' + key + '</span><span></span>';
        row.querySelector('span:last-child').textContent = val;
        opts.appendChild(row);
    }
    startTimer(q.time_left, q.deadline_ms);
    document.getElementById('reveal-btn').disabled = false;
});

document.getElementById('reveal-btn').onclick = (e) => {
    e.target.disabled = true;  // server also guards state, this just avoids a double-fire
    socket.emit('reveal_answer', {pin: PIN});
};

socket.on('question_reveal', (data) => {
    stopTimer();
    showOnly('reveal');
    document.getElementById('correct').textContent = data.correct_option;
    renderLeaderboard('leaderboard', data.leaderboard);
    document.getElementById('next-btn').disabled = false;
});

document.getElementById('next-btn').onclick = (e) => {
    e.target.disabled = true;
    socket.emit('next_question', {pin: PIN});
};

socket.on('game_over', (data) => {
    showOnly('done');
    renderLeaderboard('final-leaderboard', data.leaderboard);
});

function renderLeaderboard(elemId, board) {
    const ol = document.getElementById(elemId);
    ol.innerHTML = '';
    const maxScore = Math.max(1, ...board.map(p => p.score));
    board.forEach((p, i) => {
        const li = document.createElement('li');
        if (i === 0) li.classList.add('top');
        li.style.animationDelay = (i * 90) + 'ms';
        li.innerHTML =
            '<div class="bb-fill"></div>' +
            '<span class="bb-rank">' + (i + 1) + '</span>' +
            '<span class="bb-name"></span>' +
            '<strong class="bb-score">0</strong>';
        li.querySelector('.bb-name').textContent = p.nickname;
        ol.appendChild(li);

        const fill = li.querySelector('.bb-fill');
        const scoreEl = li.querySelector('.bb-score');
        const pct = (p.score / maxScore) * 100;
        setTimeout(() => {
            fill.style.width = pct + '%';
            animateNumber(scoreEl, 0, p.score, 650);
        }, i * 90 + 120);
    });
}

// Counts an element's textContent from `from` to `to` over `duration`ms —
// the classic Kahoot "score rolling up" reveal, driven by rAF easing.
function animateNumber(el, from, to, duration) {
    const start = performance.now();
    function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(from + (to - from) * eased);
        if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

function startTimer(secondsLeft, deadlineMs) {
    stopTimer();
    // Prefer the server's absolute deadline, converted to this client's
    // local clock via the calibrated offset, over "now + secondsLeft" —
    // the latter bakes in however long THIS message took to arrive, so two
    // clients with different delivery latency would otherwise disagree
    // about when the countdown hits zero. Falls back to the old
    // now-relative math if calibration hasn't completed yet.
    const deadline = (clockCalibrated && deadlineMs != null)
        ? deadlineMs - clockOffsetMs
        : Date.now() + secondsLeft * 1000;
    const timerEl = document.getElementById('timer');
    const fillEl = document.getElementById('timer-fill');
    const render = () => {
        const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        timerEl.textContent = remaining;
        const pct = Math.max(0, Math.min(100, (remaining / currentTimeLimit) * 100));
        fillEl.style.width = pct + '%';
        fillEl.classList.toggle('low', remaining <= 5);
        if (remaining <= 0) stopTimer();
    };
    render();
    timerInterval = setInterval(render, 250);
}

function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function showOnly(id) {
    for (const sec of ['lobby', 'question', 'reveal', 'done']) {
        document.getElementById(sec).style.display = (sec === id) ? 'block' : 'none';
    }
}
</script>
{% endblock %}
