{% extends 'base.html' %}
{% block content %}
<div id="waiting">
    <div class="text-center py-5">
        <h3>Waiting for the game to start</h3>
        <p class="text-muted">You're in as <strong>{{ nickname }}</strong></p>
        <div class="spinner-border mt-3" role="status"></div>
    </div>
</div>

<div id="question" class="gscreen" style="display:none">
    <div class="kicker">
        <span class="dot"></span>
        <span id="q-progress"></span>
        <span class="score-pop-wrap" style="margin-left:auto">
            Score <span id="my-score-inline" class="score-value">0</span>
        </span>
    </div>
    <div id="result-slot"></div>
    <h4 id="q-text" class="q-text"></h4>
    <div class="timer-row">
        <span id="timer" class="timer-num"></span>
        <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
    </div>
    <div id="q-options" class="opts-grid"></div>
</div>

<div id="reveal" class="gscreen" style="display:none">
    <div class="kicker"><span class="dot"></span>Correct answer</div>
    <h3 id="reveal-msg" style="margin:0 0 1rem;"></h3>
    <p class="text-muted" style="margin:0 0 1.2rem;">Your score: <strong id="my-score" class="score-value">0</strong></p>
    <h4 style="font-size:1rem; margin:0 0 .6rem;">Leaderboard</h4>
    <ol id="leaderboard" class="board"></ol>
    <p class="text-muted mt-3" style="margin-top:1rem;">Waiting for host to continue...</p>
</div>

<div id="done" class="gscreen" style="display:none">
    <div class="text-center">
        <h2>Game Over</h2>
        <h4 style="font-size:1rem;">Final Standings</h4>
        <ol id="final-leaderboard" class="board"></ol>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce() }}">
const PIN = "{{ pin }}";
const NICKNAME = "{{ nickname }}";
const socket = io();
let myScore = 0;
let timerInterval = null;
let currentQuestionIndex = null;
let currentTimeLimit = 20;

// Rejoin token: persisted per (pin, nickname) so reloads and network-drop
// reconnects can reclaim this exact player slot. Attackers who see the
// nickname in the public player_list broadcast do NOT get the token.
const REJOIN_KEY = 'kahoot_rejoin_' + PIN + '_' + NICKNAME;

// One-time clock-offset calibration against the server's clock (see
// socket_events.py's sync_time), so this client's countdown agrees with
// every other client's on the same real-world deadline, regardless of how
// long any individual socket message happens to take to arrive. Assumes
// symmetric latency (request/response take about the same time) — a fair
// approximation for same-network play, good enough for ~200ms agreement,
// not NTP-grade precision.
let clockOffsetMs = 0;
let clockCalibrated = false;

function calibrateClock() {
    socket.emit('sync_time', {client_sent_at: Date.now()});
}

socket.on('sync_time_ack', (data) => {
    const rtt = Date.now() - data.client_sent_at;
    clockOffsetMs = data.server_time_ms - (data.client_sent_at + rtt / 2);
    clockCalibrated = true;
});

socket.on('connect', () => {
    calibrateClock();
    const rejoin_token = localStorage.getItem(REJOIN_KEY) || undefined;
    socket.emit('player_join', {pin: PIN, nickname: NICKNAME, rejoin_token});
});

socket.on('joined', (data) => {
    if (data.rejoin_token) {
        localStorage.setItem(REJOIN_KEY, data.rejoin_token);
    }
});

socket.on('question_start', (q) => {
    currentQuestionIndex = q.index;
    currentTimeLimit = q.time_limit;
    showOnly('question');
    document.getElementById('q-progress').textContent = 'Question ' + (q.index + 1) + ' of ' + q.total;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('result-slot').innerHTML = '';
    document.getElementById('my-score-inline').textContent = myScore;

    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    const letters = ['a', 'b', 'c', 'd'];
    let i = 0;
    for (const [key, val] of Object.entries(q.options)) {
        const letterClass = 'opt-' + (letters[i++] || 'a');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt-btn ' + letterClass;
        btn.dataset.choice = key;
        btn.innerHTML = '<span class="opt-letter">' + key + '</span><span></span>';
        btn.querySelector('span:last-child').textContent = val;
        btn.onclick = () => {
            socket.emit('submit_answer', {pin: PIN, choice: key, question_index: currentQuestionIndex});
            document.querySelectorAll('#q-options .opt-btn').forEach(b => b.disabled = true);
            btn.classList.add('opt-picked');
        };
        opts.appendChild(btn);
    }

    startTimer(q.time_left, q.deadline_ms);
    // If this is a rejoin after answering, freeze the buttons to reflect
    // the previous choice so the player can't submit again.
    if (q.resumed_answer) {
        document.querySelectorAll('#q-options .opt-btn').forEach(b => {
            b.disabled = true;
            if (b.dataset.choice === q.resumed_answer) b.classList.add('opt-picked');
        });
        document.getElementById('result-slot').innerHTML =
            '<div class="result-banner late"><span class="result-icon">↺</span>Reconnected — your previous answer is locked in.</div>';
    }
});

socket.on('answer_ack', (data) => {
    const picked = document.querySelector('#q-options .opt-picked');
    if (picked) picked.classList.add(data.correct ? 'opt-correct' : 'opt-wrong');

    const slot = document.getElementById('result-slot');
    slot.innerHTML =
        '<div class="result-banner ' + (data.correct ? 'correct' : 'wrong') + '">' +
        '<span class="result-icon">' + (data.correct ? '✓' : '✕') + '</span>' +
        (data.correct ? 'Correct! ' : 'Wrong. ') + '+' + data.earned + ' points' +
        '</div>';

    const scoreEl = document.getElementById('my-score-inline');
    const wrap = scoreEl.closest('.score-pop-wrap');
    spawnFloatPoints(wrap, '+' + data.earned, data.correct ? 'correct' : 'wrong');
    animateNumber(scoreEl, myScore, data.total, 500);
    scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');

    myScore = data.total;
});

// Sent instead of answer_ack when a submission missed the server-side
// deadline — without this the player was stuck on "Waiting for
// results..." with no explanation until the next reveal, if one ever came.
socket.on('answer_late', (data) => {
    document.getElementById('result-slot').innerHTML =
        '<div class="result-banner late"><span class="result-icon">!</span>' +
        (data.message || 'Too late — no points for that one.') + '</div>';
});

socket.on('question_reveal', (data) => {
    stopTimer();
    showOnly('reveal');
    document.getElementById('reveal-msg').textContent = 'Correct answer: ' + data.correct_option;
    document.getElementById('my-score').textContent = myScore;
    renderLeaderboard('leaderboard', data.leaderboard);
});

socket.on('game_over', (data) => {
    showOnly('done');
    renderLeaderboard('final-leaderboard', data.leaderboard);
});

socket.on('error', (data) => {
    alert(data.message);
    // These errors only ever come from a failed player_join (nickname
    // taken, room not found, game already in progress) — leaving the
    // player on this dead page after dismissing the alert was a dead end.
    window.location.href = '/game/join';
});

// Sent to this exact socket when the same nickname reconnects from another
// tab/window (localStorage's rejoin token is shared across tabs on one
// browser, so the server treats it as the same player taking over). This
// tab is no longer tracked in the room, so send it home instead of leaving
// it stuck on a screen that can no longer submit answers or get updates.
socket.on('session_replaced', () => {
    window.location.href = '/';
});

function renderLeaderboard(elemId, board) {
    const ol = document.getElementById(elemId);
    ol.innerHTML = '';
    const maxScore = Math.max(1, ...board.map(p => p.score));
    board.forEach((p, i) => {
        const li = document.createElement('li');
        if (i === 0) li.classList.add('top');
        li.style.animationDelay = (i * 90) + 'ms';
        li.innerHTML =
            '<div class="bb-fill"></div>' +
            '<span class="bb-rank">' + (i + 1) + '</span>' +
            '<span class="bb-name"></span>' +
            '<strong class="bb-score">0</strong>';
        li.querySelector('.bb-name').textContent = p.nickname;
        ol.appendChild(li);

        const fill = li.querySelector('.bb-fill');
        const scoreEl = li.querySelector('.bb-score');
        const pct = (p.score / maxScore) * 100;
        setTimeout(() => {
            fill.style.width = pct + '%';
            animateNumber(scoreEl, 0, p.score, 650);
        }, i * 90 + 120);
    });
}

// Counts an element's textContent from `from` to `to` over `duration`ms —
// the classic Kahoot "score rolling up" feel, done with rAF easing rather
// than a plain setInterval so it stays smooth regardless of frame rate.
function animateNumber(el, from, to, duration) {
    const start = performance.now();
    function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(from + (to - from) * eased);
        if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

function spawnFloatPoints(wrapEl, text, cls) {
    const span = document.createElement('span');
    span.className = 'float-points ' + cls;
    span.textContent = text;
    wrapEl.appendChild(span);
    span.addEventListener('animationend', () => span.remove());
}

function startTimer(secondsLeft, deadlineMs) {
    stopTimer();
    // Deadline computed once. Every tick re-derives "remaining" from
    // (deadline - now) instead of decrementing a counter, so a tab that
    // gets backgrounded/throttled (browsers slow or pause setInterval when
    // hidden) shows the correct value the moment it's checked again,
    // rather than a stale one that drifted while hidden.
    //
    // Prefer the server's absolute deadline, converted to this client's
    // local clock via the calibrated offset, over "now + secondsLeft" —
    // the latter bakes in however long THIS message took to arrive, so two
    // clients with different delivery latency would otherwise disagree
    // about when the countdown hits zero. Falls back to the old
    // now-relative math if calibration hasn't completed yet.
    const deadline = (clockCalibrated && deadlineMs != null)
        ? deadlineMs - clockOffsetMs
        : Date.now() + secondsLeft * 1000;
    const timerEl = document.getElementById('timer');
    const fillEl = document.getElementById('timer-fill');
    const render = () => {
        const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        timerEl.textContent = remaining;
        const pct = Math.max(0, Math.min(100, (remaining / currentTimeLimit) * 100));
        fillEl.style.width = pct + '%';
        fillEl.classList.toggle('low', remaining <= 5);
        if (remaining <= 0) stopTimer();
    };
    render();
    timerInterval = setInterval(render, 250);
}

function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function showOnly(id) {
    for (const sec of ['waiting', 'question', 'reveal', 'done']) {
        document.getElementById(sec).style.display = (sec === id) ? 'block' : 'none';
    }
}
</script>
{% endblock %}
